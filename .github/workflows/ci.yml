name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The product, on every Tier 1 target. aarch64 Linux runs natively rather than
  # cross-compiled: it is the Pi 5 target, and alsa-sys plus bundled SQLite are
  # exactly the dependencies a cross-build gets wrong quietly.
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest }
          - { name: linux-aarch64, os: ubuntu-24.04-arm }
          - { name: windows-x86_64, os: windows-latest }
          - { name: macos-aarch64, os: macos-latest }
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux audio headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace

  # fmt and clippy do not vary by platform, so they run once.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # D10: the MSRV in Cargo.toml is a promise, and an unenforced promise drifts the
  # first time someone uses a newer standard-library method.
  msrv:
    name: msrv 1.90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  # D7: licence drift is the failure mode this catches. Advisories too, but those
  # are the reason everyone installs it and licences are the reason we did.
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # §2 is an architectural rule, so it gets a test rather than a code review habit:
  # nothing in crates/ may depend on Tauri, directly or transitively. WP-15 adds the
  # shell under app/, and this job is what stops the shell leaking downward.
  core-is-ui-free:
    name: core has no UI dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Assert no tauri in the core dependency graph
        run: |
          cargo tree --workspace --prefix none --format '{p}' \
            | grep -Eiq '^(tauri|wry|tao|webkit2gtk)( |$)' \
            && { echo "::error::a crate under crates/ depends on the UI shell"; exit 1; } \
            || echo "clean: no tauri, wry, tao or webkit2gtk under crates/"

  # The Phase 0 spikes are their own workspace and are not shipped, but the numbers
  # in docs/spikes/ are only reproducible while they still compile. Linux only -
  # tauri-ipc-bench needs WebKitGTK, and there is nothing to learn from building it
  # anywhere else.
  spikes:
    name: spikes still compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install spike system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes
      - run: cargo check --workspace --all-targets
        working-directory: spikes
